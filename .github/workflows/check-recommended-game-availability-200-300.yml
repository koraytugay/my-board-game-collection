name: Check Recommended Game Availability (201 - 300)

on:
  schedule:
    # Runs daily at 3:20 AM Eastern Time (07:20 UTC)
    - cron: "20 7 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bgg-collection-repo-update
  cancel-in-progress: false

jobs:
  check-recommended-availability:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: npm ci

      - name: Check Recommended Game Availability (201 - 300)
        env:
          ETSY_API_KEY: ${{ secrets.ETSY_API_KEY }}
        run: |
          node check-availability.js --recommended --start 200 --end 300
          echo "First pass finished. Starting second pass to retry failed/timed-out requests..."
          node check-availability.js --recommended --start 200 --end 300

      - name: Commit & push if changed
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git pull --rebase --autostash origin ${{ github.ref_name }}

          git add availability-recommended.json

          if git diff --quiet --staged; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "chore: update recommended game availability 201-300 ($(date -u +%F))"
          git push

      - name: Send Run Notification
        if: always()
        env:
          ICLOUD_EMAIL: ${{ secrets.ICLOUD_EMAIL }}
          ICLOUD_APP_PASSWORD: ${{ secrets.ICLOUD_APP_PASSWORD }}
          NOTIFICATION_EMAIL: ${{ secrets.NOTIFICATION_EMAIL }}
          JOB_STATUS: ${{ job.status }}
        run: node notify-run-status.js

