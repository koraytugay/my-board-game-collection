name: Check Recommended Game Availability (1 - 100)

on:
  schedule:
    # Runs daily at 1:00 AM Eastern Time (05:00 UTC)
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bgg-collection-repo-update
  cancel-in-progress: false

jobs:
  check-recommended-availability:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: npm ci

      - name: Check Recommended Game Availability (1 - 100)
        env:
          ETSY_API_KEY: ${{ secrets.ETSY_API_KEY }}
        run: |
          node check-availability.js --recommended --start 0 --end 100
          echo "First pass finished. Starting second pass to retry failed/timed-out requests..."
          node check-availability.js --recommended --start 0 --end 100

      - name: Commit & push if changed
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git pull --rebase --autostash origin ${{ github.ref_name }}

          git add availability-recommended.json

          if git diff --quiet --staged; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "chore: update recommended game availability 1-100 ($(date -u +%F))"
          git push

