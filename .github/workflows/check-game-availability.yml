name: Check Game Availability

on:
  schedule:
    # Runs daily at 6:00 AM and 1:00 PM Toronto Time (10:00 & 17:00 UTC)
    - cron: "0 10,17 * * *"
  workflow_dispatch:
  workflow_run:
    workflows: ["Update BGG collection"]
    types:
      - completed

permissions:
  contents: write

concurrency:
  group: bgg-collection-repo-update
  cancel-in-progress: false

jobs:
  check-availability:
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: npm ci

      - name: Check Game Availability & Send Notifications
        env:
          ICLOUD_EMAIL: ${{ secrets.ICLOUD_EMAIL }}
          ICLOUD_APP_PASSWORD: ${{ secrets.ICLOUD_APP_PASSWORD }}
          ETSY_API_KEY: ${{ secrets.ETSY_API_KEY }}
        run: |
          node check-availability.js
          echo "First pass finished. Starting second pass to retry failed/timed-out requests..."
          node check-availability.js
          echo "Checking for stock diffs and sending notifications if changes found..."
          node notify-availability.js

      - name: Commit & push if changed
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git pull --rebase --autostash origin ${{ github.ref_name }}

          git add availability.json

          if git diff --quiet --staged; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "chore: update game availability ($(date -u +%F))"
          git push
