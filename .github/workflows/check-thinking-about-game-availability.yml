name: Check Thinking About Game Availability

on:
  schedule:
    # Runs daily at 11:20 PM Toronto Time (03:20 UTC)
    - cron: "20 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bgg-collection-repo-update
  cancel-in-progress: false

jobs:
  check-thinking-about-availability:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: npm ci

      - name: Check Thinking About Game Availability & Send Notifications
        env:
          ICLOUD_EMAIL: ${{ secrets.ICLOUD_EMAIL }}
          ICLOUD_APP_PASSWORD: ${{ secrets.ICLOUD_APP_PASSWORD }}
          NOTIFICATION_EMAIL: ${{ secrets.NOTIFICATION_EMAIL }}
          ETSY_API_KEY: ${{ secrets.ETSY_API_KEY }}
        run: |
          node check-availability.js --thinking-about
          echo "First pass finished. Starting second pass to retry failed/timed-out requests..."
          node check-availability.js --thinking-about
          echo "Checking for stock diffs and sending notifications if changes found..."
          node notify-availability.js --thinking-about

      - name: Commit & push if changed
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git pull --rebase --autostash origin ${{ github.ref_name }}

          git add availability-thinkingabout.json last-notified-availability-thinkingabout.json

          if git diff --quiet --staged; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "chore: update thinking about game availability ($(date -u +%F))"
          git push

      - name: Send Run Notification on Failure
        if: failure()
        env:
          ICLOUD_EMAIL: ${{ secrets.ICLOUD_EMAIL }}
          ICLOUD_APP_PASSWORD: ${{ secrets.ICLOUD_APP_PASSWORD }}
          NOTIFICATION_EMAIL: ${{ secrets.NOTIFICATION_EMAIL }}
          JOB_STATUS: ${{ job.status }}
        run: node notify-run-status.js

