name: Daily Board Game Pipeline

on:
  schedule:
    # 3:15 AM, 12:15 PM, and 7:15 PM (19:15) Toronto Time (EDT: UTC-4)
    # Using minute 15 to avoid top-of-the-hour GitHub Actions scheduler congestion and dropped runs
    - cron: "15 7 * * *"    # 3:15 AM Toronto (07:15 UTC)
    - cron: "15 16 * * *"   # 12:15 PM Toronto (16:15 UTC)
    - cron: "15 23 * * *"   # 7:15 PM / 19:15 Toronto (23:15 UTC)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-board-game-pipeline
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: npm ci

      # ----------------------------------------------------
      # Stage 1: Update BGG Collection, Plays & Designers
      # ----------------------------------------------------
      - name: 1. Update BGG Collection, Plays & Designers
        env:
          BGG_USER: koraytugay
          BGG_PASSWORD: ${{ secrets.BGG_PASSWORD }}
        run: |
          echo "Fetching BGG Collection and Plays..."
          node fetch-bgg.js
          echo "Downloading new game images..."
          node download-images.js
          echo "Fetching game designer metadata..."
          node fetch-designers.js
          echo "Fetching Best At player count metadata..."
          node fetch-best-at.js

      - name: Commit & Push BGG Updates
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin ${{ github.ref_name }}
          git add collection.xml plays/ images/ designers.json best-at.json
          if ! git diff --quiet --staged; then
            git commit -m "chore: update collection, plays, designers & best-at ($(date -u +%F))"
            git push
          else
            echo "No BGG collection changes to commit."
          fi

      - name: Notify BGG Sync Success
        if: success()
        env:
          ICLOUD_EMAIL: ${{ secrets.ICLOUD_EMAIL }}
          ICLOUD_APP_PASSWORD: ${{ secrets.ICLOUD_APP_PASSWORD }}
          NOTIFICATION_EMAIL: ${{ secrets.NOTIFICATION_EMAIL }}
        run: node notify-run-status.js --workflow="1. BGG Collection & Plays" --status="success" --message="Successfully synced collection, logged plays, images, and designers from BoardGameGeek."

      # ----------------------------------------------------
      # Stage 2: Generate Fresh Game Recommendations
      # ----------------------------------------------------
      - name: 2. Generate Game Recommendations
        run: |
          echo "Calculating recommendations based on latest collection & plays..."
          node generate-recommendations.js

      - name: Commit & Push Recommendations
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin ${{ github.ref_name }}
          git add recommendations.json bgg-recs-cache.json images/
          if ! git diff --quiet --staged; then
            git commit -m "chore: update game recommendations ($(date -u +%F))"
            git push
          else
            echo "No recommendations changes to commit."
          fi

      - name: Notify Recommendations Success
        if: success()
        env:
          ICLOUD_EMAIL: ${{ secrets.ICLOUD_EMAIL }}
          ICLOUD_APP_PASSWORD: ${{ secrets.ICLOUD_APP_PASSWORD }}
          NOTIFICATION_EMAIL: ${{ secrets.NOTIFICATION_EMAIL }}
        run: node notify-run-status.js --workflow="2. Game Recommendations" --status="success" --message="Successfully re-calculated recommendations based on latest plays and ratings."

      # ----------------------------------------------------
      # Stage 3: Check Want to Buy Store Availability
      # ----------------------------------------------------
      - name: 3. Check Want to Buy Availability & Send Stock Alerts
        env:
          ICLOUD_EMAIL: ${{ secrets.ICLOUD_EMAIL }}
          ICLOUD_APP_PASSWORD: ${{ secrets.ICLOUD_APP_PASSWORD }}
          NOTIFICATION_EMAIL: ${{ secrets.NOTIFICATION_EMAIL }}
          ETSY_API_KEY: ${{ secrets.ETSY_API_KEY }}
        run: |
          echo "Checking store availability for Want to Buy games..."
          node check-availability.js
          echo "Pausing 15s before second pass retry..."
          sleep 15
          echo "Starting second pass retry for any failed/timed-out requests..."
          node check-availability.js
          echo "Sending stock alert notifications if changes found..."
          node notify-availability.js

      - name: Commit & Push Want to Buy Availability
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin ${{ github.ref_name }}
          git add availability.json last-notified-availability.json runlogs/
          if ! git diff --quiet --staged; then
            git commit -m "chore: update wanted game availability & run logs ($(date -u +%F))"
            git push
          else
            echo "No wanted game availability changes to commit."
          fi

      - name: Notify Want to Buy Check Success
        if: success()
        env:
          ICLOUD_EMAIL: ${{ secrets.ICLOUD_EMAIL }}
          ICLOUD_APP_PASSWORD: ${{ secrets.ICLOUD_APP_PASSWORD }}
          NOTIFICATION_EMAIL: ${{ secrets.NOTIFICATION_EMAIL }}
        run: node notify-run-status.js --workflow="3. Want to Buy Availability" --status="success" --message="Completed stock and price checks for Want to Buy games."

      # ----------------------------------------------------
      # Stage 4: Check Like to Have Store Availability
      # ----------------------------------------------------
      - name: 4. Check Like to Have Availability & Send Stock Alerts
        env:
          ICLOUD_EMAIL: ${{ secrets.ICLOUD_EMAIL }}
          ICLOUD_APP_PASSWORD: ${{ secrets.ICLOUD_APP_PASSWORD }}
          NOTIFICATION_EMAIL: ${{ secrets.NOTIFICATION_EMAIL }}
          ETSY_API_KEY: ${{ secrets.ETSY_API_KEY }}
        run: |
          echo "Pausing 30s before Like to Have checks to maintain healthy rate limits..."
          sleep 30
          echo "Checking store availability for Like to Have games..."
          node check-availability.js --like-to-have
          echo "Pausing 15s before second pass retry..."
          sleep 15
          echo "Starting second pass retry for any failed/timed-out requests..."
          node check-availability.js --like-to-have
          echo "Sending stock alert notifications if changes found..."
          node notify-availability.js --like-to-have

      - name: Commit & Push Like to Have Availability
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin ${{ github.ref_name }}
          git add availability-liketohave.json last-notified-availability-liketohave.json runlogs/
          if ! git diff --quiet --staged; then
            git commit -m "chore: update like to have availability & run logs ($(date -u +%F))"
            git push
          else
            echo "No like to have availability changes to commit."
          fi

      - name: Notify Like to Have Check Success
        if: success()
        env:
          ICLOUD_EMAIL: ${{ secrets.ICLOUD_EMAIL }}
          ICLOUD_APP_PASSWORD: ${{ secrets.ICLOUD_APP_PASSWORD }}
          NOTIFICATION_EMAIL: ${{ secrets.NOTIFICATION_EMAIL }}
        run: node notify-run-status.js --workflow="4. Like to Have Availability" --status="success" --message="Completed stock and price checks for Like to Have games."

      # ----------------------------------------------------
      # Pipeline Failure Notification & Log Preservation
      # ----------------------------------------------------
      - name: Send Failure Notification
        if: failure()
        env:
          ICLOUD_EMAIL: ${{ secrets.ICLOUD_EMAIL }}
          ICLOUD_APP_PASSWORD: ${{ secrets.ICLOUD_APP_PASSWORD }}
          NOTIFICATION_EMAIL: ${{ secrets.NOTIFICATION_EMAIL }}
          JOB_STATUS: ${{ job.status }}
        run: node notify-run-status.js --workflow="Daily Board Game Pipeline" --status="failure" --message="Pipeline encountered an error during execution. Please check the run logs."

      - name: Commit & Push Run Logs on Failure
        if: failure()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin ${{ github.ref_name }} || true
          git add runlogs/
          if ! git diff --quiet --staged; then
            git commit -m "chore: save pipeline run logs on failure [skip ci]" || true
            git push || true
          fi
