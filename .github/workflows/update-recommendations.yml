name: Update Game Recommendations

on:
  schedule:
    # Runs every day at 12:00 UTC
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bgg-collection-repo-update
  cancel-in-progress: false

jobs:
  generate-recommendations:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Recommendations
        run: node generate-recommendations.js

      - name: Commit & push if changed
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git pull --rebase --autostash origin ${{ github.ref_name }}

          git add recommendations.json bgg-recs-cache.json images/

          if git diff --quiet --staged; then
            echo "No changes to recommendations to commit."
            exit 0
          fi

          git commit -m "chore: update game recommendations ($(date -u +%F))"
          git push
