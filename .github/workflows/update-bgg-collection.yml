name: Update BGG collection

on:
  schedule:
    # Runs daily at 12:20 AM, 12:20 PM, and 6:20 PM Toronto Time (04:20, 16:20, 22:20 UTC)
    - cron: "20 4,16,22 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bgg-collection-repo-update
  cancel-in-progress: false

jobs:
  fetch-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: npm ci

      - name: Fetch BGG Collection & Plays
        env:
          BGG_USER: koraytugay
          BGG_PASSWORD: ${{ secrets.BGG_PASSWORD }}
        run: node fetch-bgg.js

      - name: Download New Images
        run: node download-images.js

      - name: Fetch & Cache Game Designers
        run: node fetch-designers.js

      - name: Commit & push if changed
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git pull --rebase --autostash origin ${{ github.ref_name }}

          git add collection.xml plays/ images/ designers.json

          if git diff --quiet --staged; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "chore: update collection, plays & designers ($(date -u +%F))"
          git push
