name: Notify Recommended Game Availability (Daily Summary)

on:
  schedule:
    # Runs daily at 5:20 AM Eastern Time (09:20 UTC), 1 hour after Shard 4 (4:20 AM)
    - cron: "20 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bgg-collection-repo-update
  cancel-in-progress: false

jobs:
  notify-recommended-summary:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: npm ci

      - name: Send Daily Recommended Games Stock Summary Notification
        env:
          ICLOUD_EMAIL: ${{ secrets.ICLOUD_EMAIL }}
          ICLOUD_APP_PASSWORD: ${{ secrets.ICLOUD_APP_PASSWORD }}
        run: |
          node notify-availability.js --recommended --daily-summary

      - name: Commit & push notified snapshot
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git pull --rebase --autostash origin ${{ github.ref_name }}

          git add last-notified-availability-recommended.json

          if git diff --quiet --staged; then
            echo "No changes to snapshot."
            exit 0
          fi

          git commit -m "chore: update notified snapshot for recommended games ($(date -u +%F))"
          git push
