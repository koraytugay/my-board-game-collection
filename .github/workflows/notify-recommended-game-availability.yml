name: Notify Recommended Game Availability (Daily Summary)

on:
  schedule:
    # Runs daily at 6:00 AM Eastern Time (10:00 UTC)
    - cron: "0 10 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bgg-collection-repo-update
  cancel-in-progress: false

jobs:
  notify-recommended-summary:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm ci

      - name: Send Daily Recommended Games Stock Summary Notification
        env:
          ICLOUD_EMAIL: ${{ secrets.ICLOUD_EMAIL }}
          ICLOUD_APP_PASSWORD: ${{ secrets.ICLOUD_APP_PASSWORD }}
        run: |
          node notify-availability.js --recommended --daily-summary --since "5 hours ago"
