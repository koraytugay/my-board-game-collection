name: Full Update & Deploy Pipeline

on:
  schedule:
    # Runs daily at 06:00 UTC
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: bgg-collection-repo-update
  cancel-in-progress: false

jobs:
  update:
    name: Run Full Update (BGG -> Availability -> Recommendations)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm ci

      - name: Step 1 - Fetch BGG Data
        env:
          BGG_USER: koraytugay
          BGG_PASSWORD: ${{ secrets.BGG_PASSWORD }}
        run: |
          set -euo pipefail
          
          COOKIE_HEADER="Cookie: bggusername=${BGG_USER}; bggpassword=${BGG_PASSWORD}"
          USER_AGENT="GitHubAction (curl)"
          mkdir -p plays

          fetch_data() {
            local URL=$1
            local TARGET=$2
            local NAME=$3
            local TMP_FILE="tmp_fetch.xml"
            echo "Starting fetch for $NAME..."
            
            for i in {1..15}; do
              status=$(curl -sS -o "$TMP_FILE" -w "%{http_code}" \
                "$URL" \
                -H 'accept: application/xml' \
                -H "user-agent: $USER_AGENT" \
                -H "$COOKIE_HEADER")
              
              if [ "$status" = "200" ]; then
                if grep -qE "(<items|<plays)" "$TMP_FILE"; then
                  mv "$TMP_FILE" "$TARGET"
                  echo "SUCCESS: $NAME fetched correctly."
                  return 0
                fi
              elif [ "$status" = "202" ]; then
                echo "BGG is preparing $NAME (202). Sleeping 20s..."
              fi
              sleep 20
            done
            rm -f "$TMP_FILE"
            return 1
          }

          # Fetch Collection (Base games, expansions, trade items, wishlist items)
          fetch_data "https://boardgamegeek.com/xmlapi2/collection?username=${BGG_USER}&stats=1&subtype=boardgame" "collection_bg.xml" "Base Games" || true
          fetch_data "https://boardgamegeek.com/xmlapi2/collection?username=${BGG_USER}&stats=1&subtype=boardgameexpansion" "collection_exp.xml" "Expansions" || true
          fetch_data "https://boardgamegeek.com/xmlapi2/collection?username=${BGG_USER}&stats=1&trade=1" "collection_trade.xml" "For Trade Items" || true
          fetch_data "https://boardgamegeek.com/xmlapi2/collection?username=${BGG_USER}&stats=1&wishlist=1" "collection_wish.xml" "Wishlist Items" || true

          node -e '
          const fs = require("fs");
          const itemMap = new Map();

          const filesToProcess = ["collection_wish.xml", "collection_trade.xml", "collection_exp.xml", "collection_bg.xml"];
          for (const file of filesToProcess) {
              if (fs.existsSync(file)) {
                  const content = fs.readFileSync(file, "utf8");
                  const matches = content.match(/<item\b[\s\S]*?<\/item>/g) || [];
                  for (const item of matches) {
                      const idMatch = item.match(/objectid="(\d+)"/);
                      if (idMatch) {
                          const id = idMatch[1];
                          if (!itemMap.has(id) || item.includes("fortrade=\"1\"")) {
                              itemMap.set(id, item);
                          }
                      }
                  }
                  fs.unlinkSync(file);
              }
          }

          if (itemMap.size > 0) {
              const items = Array.from(itemMap.values());
              const xml = `<?xml version="1.0" encoding="utf-8"?><items totalitems="${items.length}">${items.join("\n")}</items>`;
              fs.writeFileSync("collection.xml", xml, "utf8");
              console.log(`Successfully merged ${items.length} unique items into collection.xml`);
          }
          '

          CURRENT_MONTH=$(date +%Y-%m)
          PREV_MONTH=$(date -d "$(date +%Y-%m-01) -1 month" +%Y-%m)

          fetch_month() {
            local TARGET=$1
            local START="${TARGET}-01"
            local LAST_DAY=$(date -d "${START} +1 month -1 day" +%d)
            local END="${TARGET}-${LAST_DAY}"
            fetch_data "https://boardgamegeek.com/xmlapi2/plays?username=${BGG_USER}&mindate=${START}&maxdate=${END}" "plays/${TARGET}.xml" "Plays for $TARGET" || true
          }

          fetch_month "$PREV_MONTH"
          sleep 5
          fetch_month "$CURRENT_MONTH"

      - name: Download BGG Collection Images
        run: node download-images.js

      - name: Fetch & Cache Game Designers
        run: node fetch-designers.js

      - name: Step 2 - Check Game Availability & Send Notifications
        env:
          ICLOUD_EMAIL: ${{ secrets.ICLOUD_EMAIL }}
          ICLOUD_APP_PASSWORD: ${{ secrets.ICLOUD_APP_PASSWORD }}
          ETSY_API_KEY: ${{ secrets.ETSY_API_KEY }}
        run: |
          node check-availability.js
          echo "First pass finished. Starting second pass to retry failed/timed-out requests..."
          node check-availability.js
          echo "Checking for stock diffs and sending notifications if changes found..."
          node notify-availability.js

      - name: Step 3 - Generate Recommendations
        run: node generate-recommendations.js

      - name: Commit & push changes if any
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git pull --rebase --autostash origin ${{ github.ref_name }}

          git add collection.xml plays/ availability.json designers.json recommendations.json bgg-recs-cache.json images/

          if git diff --quiet --staged; then
            echo "No data changes to commit."
          else
            git commit -m "chore: full pipeline update (BGG, availability & recommendations) ($(date -u +%F))"
            git push
          fi

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy:
    name: Step 4 - Deploy to GitHub Pages
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
