<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-5ERQK5EYL8"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-5ERQK5EYL8');
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Sale - My Board Game Collection</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .game-comment {
            margin-top: 12px;
            padding: 10px 12px;
            background: #f8f9fa;
            border-left: 3px solid #e65100;
            border-radius: 4px;
            font-size: 0.85em;
            color: #444;
            line-height: 1.4;
            white-space: pre-line;
        }
        body.dark-mode .game-comment {
            background: #2a2a2a;
            color: #ccc;
            border-left-color: #ff9800;
        }
        .badge-forsale {
            background: #e65100;
            color: white;
        }
        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px 20px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
            margin: 20px 0;
        }
        body.dark-mode .empty-state {
            background: #2d2d2d;
            color: #e0e0e0;
        }
        .empty-state-icon {
            font-size: 3.5em;
            margin-bottom: 15px;
        }
        .empty-state h3 {
            font-size: 1.4em;
            margin-bottom: 10px;
            color: #333;
        }
        body.dark-mode .empty-state h3 {
            color: #fff;
        }
        .empty-state p {
            color: #666;
            max-width: 500px;
            margin: 0 auto 20px;
            line-height: 1.5;
        }
        body.dark-mode .empty-state p {
            color: #aaa;
        }
        .bgg-link-btn {
            display: inline-block;
            margin-top: 12px;
            padding: 8px 14px;
            background: #e65100;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-size: 0.85em;
            font-weight: bold;
            transition: background 0.2s ease;
        }
        .bgg-link-btn:hover {
            background: #bf360c;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>For Sale List</h1>
            <p class="username">@koraytugay on BoardGameGeek</p>
            <nav class="page-nav">
                <a href="index.html" class="nav-link">← Back to Collection</a>
                <a href="history.html" class="nav-link">Play History</a>
                <a href="stats.html" class="nav-link">View Statistics</a>
                <a href="challenges.html" class="nav-link">Collection Challenges</a>
                <a href="calendar.html" class="nav-link">Play Calendar</a>
                <a href="tournament.html" class="nav-link">Game Tournament</a>
                <a href="wanttobuy.html" class="nav-link">Want to Buy</a>
                <button id="random-game-btn" class="nav-link nav-button">🎲 Random Game</button>
            </nav>
        </header>

        <div id="loading" class="loading">
            <div class="spinner"></div>
            <p>Loading items for sale...</p>
        </div>

        <div id="error" class="error" style="display: none;"></div>

        <div id="stats" class="stats" style="display: none;">
            <div class="stat-card">
                <span class="stat-number" id="total-games">0</span>
                <span class="stat-label">Total For Sale</span>
            </div>
            <div class="stat-card">
                <span class="stat-number" id="avg-rating">0</span>
                <span class="stat-label">Avg BGG Rating</span>
            </div>
            <div class="stat-card">
                <span class="stat-number" id="solo-games">0</span>
                <span class="stat-label">Solo Playable</span>
            </div>
            <div class="stat-card">
                <span class="stat-number" id="total-plays">0</span>
                <span class="stat-label">Total Plays</span>
            </div>
        </div>

        <div id="controls" class="controls" style="display: none;">
            <div class="controls-row">
                <div class="control-group">
                    <label for="sort-select">Sort by:</label>
                    <select id="sort-select" onchange="sortGames(this.value)">
                        <option value="name">Name</option>
                        <option value="rating-desc">Rating (High to Low)</option>
                        <option value="rating-asc">Rating (Low to High)</option>
                        <option value="year-desc">Year (Newest First)</option>
                        <option value="year-asc">Year (Oldest First)</option>
                        <option value="plays-desc">Plays (Most First)</option>
                    </select>
                </div>

                <div class="control-group">
                    <label for="view-mode">View:</label>
                    <select id="view-mode" onchange="changeViewMode(this.value)">
                        <option value="grid">Grid</option>
                        <option value="compact">Compact</option>
                        <option value="list">List</option>
                    </select>
                </div>

                <div class="control-group">
                    <label class="checkbox-label">
                        <input type="checkbox" id="dark-mode" onchange="toggleDarkMode(this.checked)">
                        Dark Mode
                    </label>
                </div>
            </div>
        </div>

        <div id="games-grid" class="games-grid"></div>
    </div>

    <!-- Random Game Modal -->
    <div id="random-modal" class="modal" style="display: none;">
        <div class="modal-overlay" onclick="closeRandomModal()"></div>
        <div class="modal-content">
            <button class="modal-close" onclick="closeRandomModal()">×</button>
            <h2>🎲 Random Pick from For Sale</h2>
            <div id="random-game-display" class="random-game-display">
                <img id="random-game-img" class="random-game-img" src="" alt="">
                <div class="random-game-info">
                    <h3 id="random-game-name" class="random-game-name"></h3>
                    <p id="random-game-year" class="random-game-year"></p>
                    <div id="random-game-meta" class="random-game-meta"></div>
                </div>
            </div>
            <div class="modal-actions">
                <button onclick="pickRandomGame()" class="btn btn-primary">Pick Another</button>
                <button onclick="openRandomGameBGG()" class="btn btn-secondary">View on BGG</button>
            </div>
        </div>
    </div>

    <script src="api.js"></script>
    <script src="forsale.js"></script>
</body>
</html>
