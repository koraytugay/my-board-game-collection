<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-5ERQK5EYL8"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-5ERQK5EYL8');
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tier List - My Board Game Collection</title>
    <link rel="stylesheet" href="https://koraytugay.github.io/kt-styles/dist/kt.min.css">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="tierlist.css">
</head>
<body>
    <div class="kt-container">
        <header class="kt-page-header">
            <h1 class="kt-page-title">Tier List</h1>
            <p class="kt-page-subtitle">@koraytugay on BoardGameGeek</p>
        </header>

        <nav class="kt-nav"></nav>
        <script src="nav.js"></script>

        <div id="loading" class="kt-loading">
            <div class="kt-spinner"></div>
            <p>Loading tier list...</p>
        </div>

        <div id="error" class="kt-alert kt-alert--danger" style="display: none;"></div>

        <div id="tierlist-content" style="display: none;">
            <div class="tier-table">
                <!-- S Tier -->
                <div class="tier-row">
                    <div class="tier-badge">S</div>
                    <div class="tier-content" id="tier-s-grid"></div>
                </div>

                <!-- A Tier -->
                <div class="tier-row">
                    <div class="tier-badge">A</div>
                    <div class="tier-content" id="tier-a-grid"></div>
                </div>

                <!-- B Tier -->
                <div class="tier-row">
                    <div class="tier-badge">B</div>
                    <div class="tier-content" id="tier-b-grid"></div>
                </div>

                <!-- C Tier -->
                <div class="tier-row">
                    <div class="tier-badge">C</div>
                    <div class="tier-content" id="tier-c-grid"></div>
                </div>

                <!-- D Tier -->
                <div class="tier-row">
                    <div class="tier-badge">D</div>
                    <div class="tier-content" id="tier-d-grid"></div>
                </div>

                <!-- E Tier -->
                <div class="tier-row">
                    <div class="tier-badge">E</div>
                    <div class="tier-content" id="tier-e-grid"></div>
                </div>

                <!-- F Tier -->
                <div class="tier-row">
                    <div class="tier-badge">F</div>
                    <div class="tier-content" id="tier-f-grid"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="store-registry.js"></script>
    <script src="api.js"></script>
    <script src="game-details.js"></script>
    <script src="tierlist.js"></script>
</body>
</html>
