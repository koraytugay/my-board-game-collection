<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-5ERQK5EYL8"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-5ERQK5EYL8');
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Play History - My Board Game Collection</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="history.css">
    <link rel="stylesheet" href="game-details.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Play History</h1>
            <p class="username">@koraytugay on BoardGameGeek</p>
        </header>

        <nav class="page-nav"></nav>
        <script src="nav.js"></script>

        <div id="loading" class="loading">
            <div class="spinner"></div>
            <p>Loading play history...</p>
        </div>

        <div id="error" class="error" style="display: none;"></div>

        <div id="history-content" style="display: none;">
            <section class="history-section">
                <div class="history-header">
                    <h2 class="history-title">Within This Month</h2>
                    <span id="this-month-count" class="history-count-badge">0 games</span>
                </div>
                <div id="this-month-list" class="history-list">
                    <!-- Populated by JS -->
                </div>
            </section>

            <section class="history-section">
                <div class="history-header">
                    <h2 class="history-title">Within This Year</h2>
                    <span id="this-year-count" class="history-count-badge">0 games</span>
                </div>
                <div id="this-year-list" class="history-list">
                    <!-- Populated by JS -->
                </div>
            </section>

            <section class="history-section">
                <div class="history-header">
                    <h2 class="history-title">Within Last Year</h2>
                    <span id="last-year-count" class="history-count-badge">0 games</span>
                </div>
                <div id="last-year-list" class="history-list">
                    <!-- Populated by JS -->
                </div>
            </section>
        </div>
    </div>

    <script src="store-registry.js"></script>
    <script src="api.js"></script>
    <script src="game-details.js"></script>
    <script src="history.js"></script>
</body>
</html>
