<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-5ERQK5EYL8"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-5ERQK5EYL8');
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Play Calendar - My Board Game Collection</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="calendar.css">
    <link rel="stylesheet" href="game-details.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Play Calendar</h1>
            <p class="username">@koraytugay on BoardGameGeek</p>
        </header>

        <nav class="page-nav">
            <a href="index.html" class="nav-link">Collection</a>
            <a href="tierlist.html" class="nav-link">Tier List</a>
            <a href="wanttobuy.html" class="nav-link">Want to Buy</a>
            <a href="wanttoplay.html" class="nav-link">Want to Play</a>
            <a href="recommended.html" class="nav-link">Recommended Games</a>
            <a href="calendar.html" class="nav-link active">Play Calendar</a>
            <a href="history.html" class="nav-link">Play History</a>
            <a href="stats.html" class="nav-link">Statistics</a>
            <a href="challenges.html" class="nav-link">Collection Challenges</a>
            <a href="tournament.html" class="nav-link">Game Tournament</a>
            <a href="wanttosell.html" class="nav-link">Want to Sell</a>
        </nav>

        <div id="loading" class="loading">
            <div class="spinner"></div>
            <p>Loading plays...</p>
        </div>

        <div id="error" class="error" style="display: none;"></div>

        <div id="calendar-content" style="display: none;">
            <div class="calendar-container">
                <div class="calendar-header">
                    <button id="prev-month" class="month-nav-btn">← Prev</button>
                    <div id="current-month-display">March 2026</div>
                    <button id="next-month" class="month-nav-btn">Next →</button>
                </div>
                <div class="calendar-grid" id="calendar-grid">
                    <!-- Day labels -->
                    <div class="calendar-day-label">Mon</div>
                    <div class="calendar-day-label">Tue</div>
                    <div class="calendar-day-label">Wed</div>
                    <div class="calendar-day-label">Thu</div>
                    <div class="calendar-day-label">Fri</div>
                    <div class="calendar-day-label">Sat</div>
                    <div class="calendar-day-label">Sun</div>
                    <!-- Days will be populated by JS -->
                </div>
            </div>
        </div>
    </div>

    <script src="api.js"></script>
    <script src="game-details.js"></script>
    <script src="calendar.js"></script>
</body>
</html>
