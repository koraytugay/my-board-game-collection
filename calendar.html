<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-5ERQK5EYL8"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-5ERQK5EYL8');
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Play Calendar - My Board Game Collection</title>
    <link rel="stylesheet" href="https://koraytugay.github.io/kt-styles/dist/kt.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="kt-container">
        <header class="kt-page-header">
            <h1 class="kt-page-title">Play Calendar</h1>
            <p class="kt-page-subtitle">@koraytugay on BoardGameGeek</p>
        </header>

        <nav class="kt-nav"></nav>
        <script src="nav.js"></script>

        <div id="loading" class="kt-loading">
            <div class="kt-spinner"></div>
            <p>Loading plays...</p>
        </div>

        <div id="error" class="kt-alert kt-alert--danger" style="display: none;"></div>

        <div id="calendar-content" style="display: none;">
            <div class="kt-card kt-card--padded">
                <div class="kt-split kt-mb-4">
                    <button id="prev-month" class="kt-btn">← Prev</button>
                    <div id="current-month-display" class="kt-card__title">March 2026</div>
                    <button id="next-month" class="kt-btn">Next →</button>
                </div>
                <div class="kt-calendar" id="calendar-grid">
                    <!-- Day labels -->
                    <div class="kt-calendar__weekday">Mon</div>
                    <div class="kt-calendar__weekday">Tue</div>
                    <div class="kt-calendar__weekday">Wed</div>
                    <div class="kt-calendar__weekday">Thu</div>
                    <div class="kt-calendar__weekday">Fri</div>
                    <div class="kt-calendar__weekday">Sat</div>
                    <div class="kt-calendar__weekday">Sun</div>
                    <!-- Days will be populated by JS -->
                </div>
            </div>
        </div>
    </div>

    <script src="store-registry.js"></script>
    <script src="api.js"></script>
    <script src="game-details.js"></script>
    <script src="calendar.js"></script>
</body>
</html>
