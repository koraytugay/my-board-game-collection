<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-5ERQK5EYL8"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-5ERQK5EYL8');
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recommended Games - My Board Game Collection</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Recommended Board Games</h1>
            <p class="username">@koraytugay on BoardGameGeek</p>

            <nav class="page-nav">
                <a href="index.html" class="nav-link">← Back to Collection</a>
                <a href="history.html" class="nav-link">Play History</a>
                <a href="stats.html" class="nav-link">View Statistics</a>
                <a href="challenges.html" class="nav-link">Collection Challenges</a>
                <a href="calendar.html" class="nav-link">Play Calendar</a>
                <a href="tournament.html" class="nav-link">Game Tournament</a>
                <a href="recommended.html" class="nav-link active">Recommended Games</a>
                <a href="wanttobuy.html" class="nav-link">Want to Buy</a>
                <a href="wanttosell.html" class="nav-link">Want to Sell</a>
            </nav>
        </header>

        <div id="loading" class="loading">
            <div class="spinner"></div>
            <p>Loading recommendations...</p>
        </div>

        <div id="error" class="error" style="display: none;"></div>

        <div id="stats" class="stats" style="display: none;">
            <div class="stat-card">
                <span class="stat-number" id="total-recs">0</span>
                <span class="stat-label">Total Recommended</span>
            </div>
            <div class="stat-card">
                <span class="stat-number" id="total-sources">0</span>
                <span class="stat-label">Source Games</span>
            </div>
            <div class="stat-card">
                <span class="stat-number" id="avg-bgg-rating">0</span>
                <span class="stat-label">Avg Rating</span>
            </div>
        </div>

        <div id="controls" class="controls" style="display: none;">
            <div class="controls-row">
                <div class="control-group">
                    <label for="sort-select">Sort by:</label>
                    <select id="sort-select" onchange="sortGames(this.value)">
                        <option value="match-desc">Match Score (High to Low)</option>
                        <option value="rating-desc">Rating (High to Low)</option>
                        <option value="rating-asc">Rating (Low to High)</option>
                        <option value="rank-asc">BGG Rank (Best First)</option>
                        <option value="year-desc">Year (Newest First)</option>
                        <option value="year-asc">Year (Oldest First)</option>
                        <option value="name">Name</option>
                    </select>
                </div>

                <div class="control-group">
                    <label for="view-mode">View:</label>
                    <select id="view-mode" onchange="changeViewMode(this.value)">
                        <option value="grid">Grid</option>
                        <option value="compact">Compact</option>
                        <option value="list">List</option>
                    </select>
                </div>

                <div class="control-group">
                    <label class="checkbox-label">
                        <input type="checkbox" id="dark-mode" onchange="toggleDarkMode(this.checked)">
                        Dark Mode
                    </label>
                </div>
            </div>

            <div class="controls-row">
                <div class="control-group">
                    <label for="search-input">Search:</label>
                    <input type="text" id="search-input" placeholder="Filter by name or source..." oninput="applyFilters()">
                </div>

                <div class="control-group">
                    <label for="rating-filter">Rating:</label>
                    <select id="rating-filter" onchange="applyFilters()">
                        <option value="all">All</option>
                        <option value="8+">8.0+</option>
                        <option value="7+">7.0+</option>
                        <option value="6+">6.0+</option>
                    </select>
                </div>
            </div>
        </div>

        <div id="games-grid" class="games-grid"></div>
    </div>

    <script src="recommended.js"></script>
</body>
</html>
