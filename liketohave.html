<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Like to Have - My Board Game Collection</title>
    <link rel="stylesheet" href="https://koraytugay.github.io/kt-styles/dist/kt.min.css">
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎲</text></svg>">
</head>
<body>
    <div class="kt-container">
        <header class="kt-page-header">
            <h1 class="kt-page-title">Like to Have List</h1>
            <p class="kt-page-subtitle">Games that I would like to have, with live store availability</p>
        </header>

        <nav class="kt-nav"></nav>
        <script src="nav.js"></script>

        <div id="loading" class="kt-loading">
            <div class="kt-spinner"></div>
            <p>Loading Like to Have games and store availability...</p>
        </div>

        <div id="error" class="kt-alert kt-alert--danger" style="display: none;"></div>

        <div id="controls" class="kt-toolbar" style="display: none;">
            <div class="kt-toolbar__row">
                <div class="kt-field kt-field--inline">
                    <label class="kt-field__label" for="sort-select">Sort by</label>
                    <select class="kt-select" id="sort-select" onchange="sortGames(this.value)">
                        <option value="name">Name</option>
                        <option value="rating-desc">Rating (High to Low)</option>
                        <option value="rating-asc">Rating (Low to High)</option>
                        <option value="myrating-desc">My Rating (High to Low)</option>
                        <option value="myrating-asc">My Rating (Low to High)</option>
                        <option value="year-desc">Year (Newest First)</option>
                        <option value="year-asc">Year (Oldest First)</option>
                    </select>
                </div>

                <div class="kt-field kt-field--inline">
                    <label class="kt-field__label" for="view-mode">View</label>
                    <select class="kt-select" id="view-mode" onchange="changeViewMode(this.value)">
                        <option value="grid">Grid</option>
                        <option value="compact">Compact</option>
                        <option value="list">List</option>
                    </select>
                </div>

                <label class="kt-check">
                    <input type="checkbox" id="in-stock-only" onchange="applyFilters()">
                    In Stock Only
                </label>

                <label class="kt-check">
                    <input type="checkbox" id="major-deals-only" onchange="applyFilters()">
                    Deals
                </label>

                <label class="kt-check">
                    <input type="checkbox" id="dark-mode" onchange="toggleDarkMode(this.checked)">
                    Dark Mode
                </label>
            </div>

            <div class="kt-toolbar__row">
                <div class="kt-field kt-field--inline">
                    <label class="kt-field__label" for="search-input">Search</label>
                    <input type="text" class="kt-input" id="search-input" placeholder="Filter by name..." oninput="applyFilters()">
                </div>

                <div class="kt-field kt-field--inline">
                    <label class="kt-field__label" for="player-count">Players</label>
                    <select class="kt-select" id="player-count" onchange="applyFilters()">
                        <option value="all">All</option>
                        <option value="1">1</option>
                        <option value="1-only">Solo Only</option>
                        <option value="2">2</option>
                        <option value="2-only">2 Player Only</option>
                        <option value="3">3</option>
                        <option value="4">4</option>
                        <option value="5">5+</option>
                    </select>
                </div>

                <div class="kt-field kt-field--inline">
                    <label class="kt-field__label" for="play-time">Play Time</label>
                    <select class="kt-select" id="play-time" onchange="applyFilters()">
                        <option value="all">All</option>
                        <option value="0-30">Under 30 min</option>
                        <option value="30-60">30-60 min</option>
                        <option value="60-120">60-120 min</option>
                        <option value="120-999">Over 120 min</option>
                    </select>
                </div>

                <div class="kt-field kt-field--inline">
                    <label class="kt-field__label" for="rating-filter">Rating</label>
                    <select class="kt-select" id="rating-filter" onchange="applyFilters()">
                        <option value="all">All</option>
                        <option value="8+">8.0+</option>
                        <option value="7+">7.0+</option>
                        <option value="6+">6.0+</option>
                    </select>
                </div>

                <div class="kt-field kt-field--inline">
                    <label class="kt-field__label" for="designer-filter">Designer</label>
                    <select class="kt-select" id="designer-filter" onchange="applyFilters()">
                        <option value="all">All Designers</option>
                    </select>
                </div>
            </div>

            <div class="kt-toolbar__row">
                <div class="kt-field kt-field--inline">
                    <label class="kt-field__label" for="store-filter">Store</label>
                    <select class="kt-select" id="store-filter" onchange="applyFilters()">
                        <option value="all">All Stores</option>
                    </select>
                </div>

                <div class="kt-field kt-field--inline">
                    <label class="kt-field__label" for="seller-filter">BGG Seller</label>
                    <select class="kt-select" id="seller-filter" onchange="applyFilters()">
                        <option value="all">All Sellers</option>
                    </select>
                </div>
            </div>
        </div>

        <div id="games-grid" class="kt-grid"></div>
    </div>

    <script src="store-registry.js"></script>
    <script src="api.js"></script>
    <script src="game-details.js"></script>
    <script src="wishlist.js" data-list="liketohave"></script>
</body>
</html>
